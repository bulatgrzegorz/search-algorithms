name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter, e.g. *  |  *SearchBenchmarks*  |  *.Filter(*Size: Small*"
        default: "*"
      job:
        description: "BenchmarkDotNet --job: dry = smoke test, short = quick, default = precise"
        type: choice
        options: [default, short, medium, dry]
        default: default

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: data/download.sh
      - name: Run benchmarks
        working-directory: benchmarks/SearchAlgorithms.Benchmarks
        env: # passed via env, not inlined, so input text can't inject shell
          FILTER: ${{ inputs.filter }}
          JOB: ${{ inputs.job }}
        run: dotnet run -c Release -- --filter "$FILTER" --job "$JOB"
      - name: Job summary
        if: always()
        working-directory: benchmarks/SearchAlgorithms.Benchmarks/BenchmarkDotNet.Artifacts
        run: |
          cat results/*-github.md >> "$GITHUB_STEP_SUMMARY" || true
          { echo '### Background writer rates'; echo '```'; grep -hE '^// Benchmark: |^Writer:' *.log | grep -B1 '^Writer:' | grep -v '^--$'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/SearchAlgorithms.Benchmarks/BenchmarkDotNet.Artifacts
