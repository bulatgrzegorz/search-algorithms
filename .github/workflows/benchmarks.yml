name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet --filter, e.g. *  |  *SearchBenchmarks*  |  *.Filter(*Size: Small*"
        default: "*"
      job:
        description: "BenchmarkDotNet --job: dry = smoke test, short = quick, default = precise (narrow the filter, it can take hours)"
        type: choice
        options: [short, default, medium, dry]
        default: short

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      algorithms: ${{ steps.list.outputs.algorithms }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - id: list
        run: echo "algorithms=$(dotnet run -c Release --no-build --project benchmarks/SearchAlgorithms.Benchmarks -- --algorithms)" >> "$GITHUB_OUTPUT"

  # One job per algorithm: they run in parallel with their own 6 h limit, so a slow one can't starve the others.
  benchmark:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        algorithm: ${{ fromJSON(needs.test.outputs.algorithms) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: data/download.sh
      - name: Run benchmarks
        working-directory: benchmarks/SearchAlgorithms.Benchmarks
        env: # passed via env, not inlined, so input text can't inject shell
          FILTER: ${{ inputs.filter }}
          JOB: ${{ inputs.job }}
          ALGORITHM: ${{ matrix.algorithm }}
        run: dotnet run -c Release -- --filter "$FILTER" --job "$JOB"
      - name: Job summary
        if: always()
        working-directory: benchmarks/SearchAlgorithms.Benchmarks/BenchmarkDotNet.Artifacts
        run: |
          cat results/*-github.md >> "$GITHUB_STEP_SUMMARY" || true
          { echo '### Background writer rates'; echo '```'; grep -hE '^// Benchmark: |^Writer:' *.log | grep -B1 '^Writer:' | grep -v '^--$'; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results-${{ matrix.algorithm }}
          path: benchmarks/SearchAlgorithms.Benchmarks/BenchmarkDotNet.Artifacts
